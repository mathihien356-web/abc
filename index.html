<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Image Gallery</h1>
    <p class="intro">Bộ sưu tập hình ảnh</p>

    <div class="gallery">
        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Phong cảnh hồ và núi">
                <div class="description">Phong cảnh thiên nhiên</div>
            </div>
        </div>

        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Phong cảnh ngoài trời">
                <div class="description">Khám phá thiên nhiên</div>
            </div>
        </div>

        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Hồ nước giữa núi">
                <div class="description">Hồ nước và núi</div>
            </div>
        </div>

        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Khu rừng xanh">
                <div class="description">Khu rừng xanh</div>
            </div>
        </div>

        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Ánh nắng buổi sáng">
                <div class="description">Bình minh</div>
            </div>
        </div>

        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Dãy núi cao">
                <div class="description">Dãy núi hùng vĩ</div>
            </div>
        </div>

        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600" alt="Động vật trong tự nhiên">
                <div class="description">Động vật hoang dã</div>
            </div>
        </div>

        <div class="responsive">
            <div class="image-card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Bãi biển">
                <div class="description">Biển xanh</div>
            </div>
        </div>
    </div>

    <div class="clearfix"></div>
</body>
</html>
